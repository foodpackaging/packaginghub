name: b2b_store
description: B2B/B2C Ecommerce Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  provider: ^6.1.5+1
  
  # Backend & Auth
  flutter_secure_storage: ^10.3.1

  # Push notifications
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2

  # Navigation
  go_router: ^17.2.2
  
  # UI Components
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  badges: ^3.1.2
  flutter_svg: ^2.0.10+1
  flutter_rating_bar: ^4.0.1
  flutter_widget_from_html_core: ^0.17.2
  animations: ^2.0.11
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  form_field_validator: ^1.1.0
  
  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  flutter_dotenv: ^6.0.1
  razorpay_flutter: ^1.4.4
  open_filex: ^4.7.0
  pdf: ^3.12.0
  printing: ^5.14.3
  http: ^1.2.2
  
  # Icons
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.14
  riverpod_lint: ^3.1.3
  
  # Linting
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/Illustration/login_illustration.jpg
    - assets/flags/
    - assets/logo/
    - assets/screens/

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900
